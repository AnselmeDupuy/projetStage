resolved_by = "Messaging Infrastructure Team"

###########################################################################################

[postmortem]
lessons_learned = [
    "Retry windows should be bounded so queue growth cannot outpace consumption.",
    "Customer-facing notification latency needs proactive backlog monitoring."
]

preventive_actions = [
    "Add queue depth alerts for push delivery",
    "Introduce adaptive retry backoff for provider handshakes",
    "Review consumer scaling thresholds for peak traffic windows"
]

